<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<title>同欣冒險者公會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 古典配色：象牙羊皮紙、墨藍、古金 */
:root{
  --bg:#f3ede0;--card:#fffdf8;--ink:#2a2622;--sub:#5e564c;--line:#3a3128;--edge:#cdb98f;
  --navy:#1f2a44;--gold:#b8924a;--gold-d:#7a5c2a;--gold-l:#ecdcb4;
  --red:#b5403a;--green:#3f8a4e;--blue:#3a64a6;--gray:#6e6860;--warn:#a5520f;--xp:#6a4fa8;
}
html{font-size:18px}
html.big{font-size:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:500;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
b,strong,h1,h2,th{font-weight:700}
a{color:var(--blue);text-underline-offset:3px}
.px{font-weight:700;letter-spacing:.04em}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:180px}
svg.spr{display:block;image-rendering:pixelated}

/* ── 裝飾 ── */
/* 金色邊角：只用在重點卡片 */
.card.orn,.fxbox.orn{background:
  linear-gradient(var(--gold),var(--gold)) top 6px left 6px/14px 1.5px,
  linear-gradient(var(--gold),var(--gold)) top 6px left 6px/1.5px 14px,
  linear-gradient(var(--gold),var(--gold)) top 6px right 6px/14px 1.5px,
  linear-gradient(var(--gold),var(--gold)) top 6px right 6px/1.5px 14px,
  linear-gradient(var(--gold),var(--gold)) bottom 6px left 6px/14px 1.5px,
  linear-gradient(var(--gold),var(--gold)) bottom 6px left 6px/1.5px 14px,
  linear-gradient(var(--gold),var(--gold)) bottom 6px right 6px/14px 1.5px,
  linear-gradient(var(--gold),var(--gold)) bottom 6px right 6px/1.5px 14px,
  var(--card);background-repeat:no-repeat}
.divider{display:block;margin:6px auto 0}

/* layout */
.topbar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:4px double var(--gold)}
.topbar h1{margin:0;font-size:1.2rem;color:var(--gold-l)}
.topbar .back{background:none;border:1.5px solid var(--gold-l);color:#fff;border-radius:6px;min-height:44px;padding:0 14px;cursor:pointer}
.card{background:var(--card);border:1.5px solid var(--edge);border-radius:8px;box-shadow:0 2px 0 #e2d4b2,0 6px 14px rgba(70,50,20,.07);padding:14px;margin:14px 16px}
h2{font-size:1.1rem;margin:0 0 10px}
.sec-title{margin:22px 16px 4px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.sec-title:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-left:6px}
.muted{color:var(--sub)}
.hint{margin:10px 16px;color:var(--sub);font-size:.9rem}

/* buttons */
.btn{min-height:52px;border:1.5px solid var(--gold-d);border-radius:6px;box-shadow:0 2px 0 var(--gold-d);background:linear-gradient(#d9b874,#bf9850);color:#2a2216;font-weight:700;padding:0 18px;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--gold-d)}
.btn.ghost{background:var(--card)}
.btn.danger{background:var(--card);color:var(--red);border-color:var(--red);box-shadow:0 2px 0 var(--red)}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row>.btn{flex:1}

/* status */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:999px;color:#fff;font-size:.9rem;font-weight:700;white-space:nowrap}
.s-doing{background:var(--red)}.s-won{background:var(--green)}.s-quiet{background:var(--blue)}.s-no{background:var(--gray)}
.warn{color:var(--warn);font-weight:700}

/* profile */
.profile{display:flex;gap:14px;align-items:center}
.ava{border:3px solid #b8b0a0;border-radius:6px;background:linear-gradient(#efe6d2,#ddd0b4);padding:3px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.ptitle{font-size:1rem;color:var(--sub)}
.pname{font-size:1.25rem;font-weight:700}
.lv{color:var(--xp);font-size:1.1rem;margin-left:6px}
.xpbar{height:14px;border:1.5px solid var(--gold-d);border-radius:7px;background:#ece4d2;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(#8a72c4,var(--xp))}
.xptext{font-size:.85rem;color:var(--sub);margin-top:2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 16px}
.chip{min-height:44px;padding:0 14px;border:1.5px solid var(--edge);border-radius:999px;background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid #fff}

/* case card */
.case{display:block;width:calc(100% - 32px);text-align:left;cursor:pointer}
.case .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .cat{color:var(--sub);font-size:.95rem}
.cname{font-size:1.25rem;font-weight:700;margin:6px 0 4px}
.owner{font-size:.95rem;color:var(--sub)}
.prog{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;border:1.5px solid #b9a780;border-radius:7px;background:#ece4d2;overflow:hidden}
.bar i{display:block;height:100%}
.pct{font-weight:700;white-space:nowrap}
.meta{font-size:.95rem;margin-top:6px;color:var(--sub)}
.case.stale{border-color:var(--warn);border-left:6px solid var(--warn)}

/* FAB + nav */
.fab{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);min-height:60px;font-size:1.15rem;padding:0 28px;border-radius:999px;z-index:20;white-space:nowrap}
.fab:active{transform:translateX(-50%) translateY(2px)}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 2px 0 var(--gold-d),0 0 0 0 rgba(184,146,74,.8)}50%{box-shadow:0 2px 0 var(--gold-d),0 0 0 14px rgba(184,146,74,0)}}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--navy);display:flex;border-top:4px double var(--gold);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;min-height:72px;background:none;border:none;color:#cfd3e6;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.95rem}
.nav button .ic{font-size:1.4rem;line-height:1}
.nav button.on{color:var(--gold-l);background:rgba(255,255,255,.07)}

/* forms */
label.f,div.f{display:block;margin:0 0 16px}
label.f>span{display:block;font-weight:700;margin-bottom:4px}
.inp{width:100%;min-height:52px;border:1.5px solid #b9a780;border-radius:6px;padding:8px 12px;background:#fff}
textarea.inp{min-height:90px;resize:vertical}
.req{color:var(--red)}
input[type=range]{--p:0;width:100%;height:48px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:16px;border:1.5px solid var(--gold-d);border-radius:8px;background:linear-gradient(to right,var(--gold) calc(var(--p)*1%),#ece4d2 0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-11px;background:var(--card);border:2px solid var(--gold-d);border-radius:50%;box-shadow:0 2px 0 var(--gold-d)}
input[type=range]::-moz-range-track{height:14px;border:1.5px solid var(--gold-d);border-radius:8px;background:#ece4d2}
input[type=range]::-moz-range-progress{height:14px;background:var(--gold);border-radius:8px}
input[type=range]::-moz-range-thumb{width:30px;height:30px;background:var(--card);border:2px solid var(--gold-d);border-radius:50%}
.bigpct{font-size:1.6rem;color:var(--ink)}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stbtn{min-height:56px;border:2.5px solid var(--c);border-radius:6px;background:var(--card);color:var(--c);font-weight:700;cursor:pointer}
.stbtn.on{background:var(--c);color:#fff;border-color:var(--line);box-shadow:0 2px 0 var(--line)}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{border-left:2px solid var(--gold);padding:0 0 14px 16px;position:relative}
.tl li:before{content:"";position:absolute;left:-7px;top:6px;width:10px;height:10px;background:var(--navy);border:1.5px solid var(--gold);transform:rotate(45deg)}
.tl .when{font-size:.9rem;color:var(--sub)}
.tl .note{background:#f7f0e2;border-radius:6px;padding:6px 10px;margin-top:4px}
.tl .note.boss{background:#f6ead0;border-left:3px solid var(--gold)}
.bossflag{display:inline-block;background:#f6ead0;border:1px solid var(--gold);color:#6a4a14;border-radius:999px;padding:0 10px;font-size:.9rem;margin-bottom:4px}

/* login */
.hero{text-align:center;padding:26px 16px 14px;background:radial-gradient(ellipse at top,#2c3a5c,var(--navy) 70%);color:#fff;border-bottom:4px double var(--gold)}
.hero h1{font-size:1.7rem;margin:10px 0 0;color:var(--gold-l)}
.hero .en{color:#cfc3a0;font-size:.85rem;letter-spacing:.35em;margin-top:2px}
.hero .ava{display:inline-block}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.namegrid .btn{background:var(--card);font-size:1.1rem}
.namegrid .btn.boss{grid-column:1/-1;background:linear-gradient(#f3e6c4,#e3cf9c)}
.pins{display:flex;justify-content:center;gap:14px;margin:14px 0}
.pins i{width:20px;height:20px;border:2px solid var(--gold-d);border-radius:50%}
.pins i.f{background:var(--navy);border-color:var(--navy)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad .btn{background:var(--card);font-size:1.4rem;min-height:64px}
.err{color:var(--red);text-align:center;font-weight:700;min-height:1.5em}

/* character creator */
.preview{display:flex;justify-content:center;padding:12px;background:radial-gradient(ellipse at 50% 35%,#f8f1e0,#ddcfae);border:1.5px solid var(--edge);border-radius:6px}
.opts{display:grid;gap:8px}
.opts.c5{grid-template-columns:repeat(5,1fr)}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts.c2{grid-template-columns:repeat(2,1fr)}
.opt{min-height:52px;border:1.5px solid var(--edge);border-radius:6px;background:var(--card);cursor:pointer;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.95rem}
.flabel{display:block;font-weight:700;margin-bottom:6px}
.phint{background:#fbf3e0;border:1.5px dashed var(--gold);border-radius:6px;padding:8px 10px;margin:6px 0 4px;font-size:.95rem}
.opt.on{background:#f6ead0;box-shadow:inset 0 0 0 2.5px var(--gold);border-color:var(--gold-d)}
.opt .ic{font-size:1.4rem}
.opts.c5 .opt{font-size:.85rem;white-space:nowrap}
.swatch{width:100%;min-height:40px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer}
.swatch.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--gold)}

/* lobby */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 16px}
.tile{border:1.5px solid var(--edge);border-radius:6px;box-shadow:0 2px 0 #e2d4b2;background:var(--card);padding:10px 6px;text-align:center;cursor:pointer}
.tile .n{font-size:1.8rem;line-height:1.2}
.tile .l{font-size:.9rem;font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:8px 4px;text-align:center;border-bottom:1px solid #e6dcc6}
.tbl th{font-size:.85rem;color:var(--sub)}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.click{cursor:pointer}
.mini{display:flex;align-items:center;gap:8px}
.catrow{margin-bottom:12px}
.catrow .row{justify-content:space-between}

/* roster */
.member{display:flex;align-items:center;gap:12px}
.member .ava{padding:2px}

/* switch */
.sw{display:flex;justify-content:space-between;align-items:center;min-height:56px;gap:10px}
.toggle{width:68px;height:38px;border:1.5px solid var(--line);border-radius:999px;background:#ddd5c4;position:relative;cursor:pointer;flex-shrink:0}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid var(--line);transition:left .15s}
.toggle.on{background:var(--green)}
.toggle.on:after{left:31px}
.setbtn{width:100%;text-align:left;min-height:56px;background:none;border:none;border-bottom:1px solid #ebe2cf;cursor:pointer;font-size:1rem}

/* dialog / overlays */
.overlay{position:fixed;inset:0;background:rgba(24,22,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.dlg{width:calc(100% - 24px);max-width:456px;margin:0 12px 16px;display:flex;gap:12px;align-items:flex-start;animation:up .25s}
.dlg .ava{border-color:#9db08a}
.dlg-name{color:#4e6b45;font-size:1.05rem}
.dlg-text{margin:4px 0 12px;font-size:1.05rem}
.dlg-body{flex:1;min-width:0}
.dlg{flex-wrap:wrap}
.dlg-btns{width:100%;margin-top:2px}
.dlg-btns .btn{white-space:nowrap}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.fx{align-items:center}
.fxbox{border:1.5px solid var(--gold);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:24px 18px;margin:16px;max-width:400px;width:100%;text-align:center;animation:pop .4s;position:relative;overflow:hidden}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.05)}}
.fxbig{font-size:2rem;color:var(--xp);margin:4px 0 4px}
.fxbig.gold{color:#9a6a1c}
.fxbox .ava{display:inline-block;margin:10px auto 6px}
.spark{position:absolute;font-size:1.2rem;color:var(--gold);animation:tw 1.2s infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--xp);color:#fff;border:1.5px solid #4a3480;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.2);padding:10px 18px;z-index:60;font-weight:700;animation:up .25s;max-width:92vw;text-align:center}
.empty{text-align:center;padding:20px}
.empty .ava{display:inline-block}
.xptbl td{padding:6px 0;border-bottom:1px solid #ebe2cf}
.xptbl td:last-child{text-align:right;font-weight:700;color:var(--xp)}
.road{display:flex;align-items:center;gap:12px;padding:10px;border-left:3px solid #ddd3bf;margin-left:6px;color:var(--sub)}
.road .rl{min-width:52px}
.road.done{border-left-color:var(--gold);color:var(--ink)}
.road.here{background:#f8eed6;border-radius:0 6px 6px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="dlg"></div>
<div id="fx"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* ===================== 設定 ===================== */
const DAY = 86400000;
const STALE_DAYS = 14;
const CLASSES = {
  mage:     { n:'魔法師', i:'🔮', c:'#6a45b8', d:'#4a2f86' },
  knight:   { n:'騎士',   i:'⚔️', c:'#8d99a8', d:'#5f6b7a' },
  priest:   { n:'牧師',   i:'✚',  c:'#f4f4f4', d:'#c8c8c8' },
  archer:   { n:'射手',   i:'🏹', c:'#3f8f4a', d:'#2a6633' },
  assassin: { n:'刺客',   i:'🗡️', c:'#3a3d48', d:'#22242c' },
};
const HAIRS = { short:'短髮', long:'長髮', pony:'馬尾' };
const HAIR_COLORS = ['#2a2420','#5e3a24','#c8a066','#b8b4ae','#8a3a2a','#e09ab0','#6aa4d8','#72b89a','#9478c8','#e08a3c'];
const HAIR_NAMES  = ['黑','深棕','金','銀灰','紅','櫻花粉','天空藍','薄荷綠','薰衣草紫','橘'];
const STATUS = {
  doing:{ n:'進行中',   c:'var(--red)'   },
  won:  { n:'已成交',   c:'var(--green)' },
  quiet:{ n:'暫無回應', c:'var(--blue)'  },
  no:   { n:'無意願',   c:'var(--gray)'  },
};
const CATS = ['伴唱機租賃','沉浸式包廂','音響周邊銷售','其他'];
const STAGES = [ {n:'諮詢'},{n:'場勘'},{n:'報價'},{n:'簽約'},{n:'其他'},{n:'完工'} ];
const OTHER_STAGE = 4, SIGN_STAGE = 3, DONE_STAGE = STAGES.length-1;   // 其他（自填）／簽約／完工＝成交
const stageLabel = o => o.stage===OTHER_STAGE && o.stageNote ? o.stageNote : STAGES[o.stage].n;
const XP = { add:10, stage:20, note:5, won:200 };

/* ===================== 等級 ===================== */
const need = lv => 50 + 25*(lv-1);
function lvInfo(xp){ let lv=1, rest=xp; while(rest>=need(lv)){ rest-=need(lv); lv++; } return {lv, cur:rest, need:need(lv)}; }
/* ===================== 轉職 ===================== */
// Lv.10 一轉、Lv.25 二轉（二選一路線）、Lv.50 三轉（沿所選路線）
const JOB_LV = [1,10,25,50];
const FRAMES = ['#b8b0a0','#b87333','#aab4c0','#e0b030'];   // 頭像外框：見習／一轉／二轉／三轉
const JOBS = {
  knight:  { n:['見習騎士','騎士'],
             A:{n2:'聖騎士',  n3:'天堂騎士', d:'守護之道：以神聖之光守護夥伴', cape:'#efe2b8', aura:'#fff0a0'},
             B:{n2:'龍騎士',  n3:'龍王',     d:'征戰之道：駕馭巨龍的力量',     cape:'#a8303e', aura:'#e0524a'} },
  mage:    { n:['見習法師','魔法師'],
             A:{n2:'大魔導士',n3:'賢者',     d:'智慧之道：參透天地的奧秘',     cape:'#3f5fb0', aura:'#9fe2ff'},
             B:{n2:'黑魔導士',n3:'魔導王',   d:'禁忌之道：掌控黑暗的魔力',     cape:'#3a2450', aura:'#a86ad8'} },
  priest:  { n:['見習牧師','牧師'],
             A:{n2:'主教',    n3:'聖者',     d:'祈禱之道：以聖光帶來祝福',     cape:'#efe2b8', aura:'#fff0a0'},
             B:{n2:'武僧',    n3:'拳聖',     d:'修行之道：以肉身鍛鍊意志',     cape:'#c0602a', aura:'#ffa050'} },
  archer:  { n:['見習射手','射手'],
             A:{n2:'遊俠',    n3:'神射手',   d:'精準之道：百步穿楊，箭無虛發', cape:'#2d4f6e', aura:'#a8e88a'},
             B:{n2:'獵人',    n3:'獸王',     d:'荒野之道：與野獸並肩作戰',     cape:'#6b4426', aura:'#e8b058'} },
  assassin:{ n:['見習刺客','刺客'],
             A:{n2:'暗影刺客',n3:'影武者',   d:'暗影之道：化身為無形的影子',   cape:'#2a2438', aura:'#9a7ae0'},
             B:{n2:'忍者',    n3:'上忍',     d:'忍之道：迅捷如風，來去無蹤',   cape:'#1f2a3a', aura:'#58c8b8'} },
};
const jobStage = lv => lv>=50 ? 3 : lv>=25 ? 2 : lv>=10 ? 1 : 0;
const jobName = (cls, st, path) => st<2 ? JOBS[cls].n[st] : JOBS[cls][path][st===2?'n2':'n3'];
function jobInfo(u){
  let st = jobStage(lvInfo(u.xp).lv), pending = false;
  const path = u.char.path;
  if(st>=2 && !path){ pending = true; st = 1; }          // 到了 Lv.25 但還沒選路線
  return { stage:st, path, pending, name:jobName(u.char.cls, st, path) };
}
function titleOf(u){
  if(u.role==='boss') return '👑 公會會長（老闆）';
  if(!u.char) return '新進冒險者';
  return `${CLASSES[u.char.cls].i} ${jobInfo(u).name}`;
}

/* ===================== 像素角色 ===================== */

  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);

  const out=G.map(a=>a.slice());

function addCase(){
  const name=$('#a-name').value.trim();
  if(!name){ $('#a-err').textContent='請填寫客戶名稱'; $('#a-name').focus(); return; }
  const catNote=$('#a-catnote').value.trim();
  if(ui.addCat==='其他' && !catNote){ $('#a-err').textContent='選了「其他」，請說明是什麼服務'; $('#a-catnote').focus(); return; }
  const stageNote = ui.addStage===OTHER_STAGE ? $('#a-stagenote').value.trim() : '';
  if(ui.addStage===OTHER_STAGE && !stageNote){ $('#a-err').textContent='選了「其他」階段，請填寫目前在做什麼'; $('#a-stagenote').focus(); return; }
  if(!ui.addPSet){ $('#a-err').textContent='請拉動「整體案件進度」，評估目前大約走到哪裡'; return; }
  const u=me(), stage=ui.addStage, p=ui.addP, now=Date.now();
  const c={id:'c'+(++S.seq),owner:u.id,name,cat:ui.addCat,catNote:ui.addCat==='其他'?catNote:'',stage,stageNote,p,st:'doing',
    contact:$('#a-contact').value.trim(),phone:$('#a-phone').value.trim(),addr:$('#a-addr').value.trim(),
    created:now,updated:now,stagesDone:[stage],dealXP:false,noteDay:null,
    hist:[{t:now,by:u.id,stage,stageNote,p,st:'doing',note:'建立案件'}]};
  S.cases.push(c);
  const lv=award(u,[['新增客戶',XP.add]],c.id);
  save(); ui.hf='all'; go('home');
  toast(`✨ +${XP.add} XP　新增客戶`);

    elara([
      `做得好！你接下了第一位客戶「<b>${esc(name)}</b>」，獲得 <b>+${XP.add} XP</b>！`,
      `之後點進案件，就能<b>選階段、微調進度、寫備註</b>。每次更新記得寫一句備註或推進階段喔。階段到「<b>完工</b>」就算成交！<br>每到達一個新階段 +${XP.stage} XP，寫備註 +${XP.note} XP，<b>成交 +${XP.won} XP</b>！`,

    ], ()=>levelFx(lv));
  } else levelFx(lv);
}

/* ===================== 經驗值 ===================== */
function award(u, gains, caseId){
  const before=lvInfo(u.xp).lv;
  gains.forEach(([why,xp])=>{ u.xp=Math.max(0,u.xp+xp); S.xplog.push({t:Date.now(),uid:u.id,caseId,why,xp}); });
  return {before, after:lvInfo(u.xp).lv, u};
}
function levelFx(lv, then){
  if(!lv || lv.after<=lv.before){ then&&then(); return; }
  const u=lv.u, sb=jobStage(lv.before), sa=jobStage(lv.after);
  let jobHtml='', btn=`<button class="btn block" onclick="$('#fx').innerHTML=''">太棒了！</button>`;
  if(u.char && sa>sb){
    if(sa>=2 && !u.char.path){
      jobHtml=`<p style="font-size:1.1rem">🌟 你已達到 <b>Lv.25</b>，可以進行<b>二轉</b>了！<br>有兩條路線可以選擇。</p>`;
      btn=`<button class="btn block" onclick="$('#fx').innerHTML='';go('job')">前往選擇轉職路線 ▶</button>`;
    } else jobHtml=`<div class="px" style="font-size:1.3rem;color:#c27c00;margin-top:4px">✨ 轉職成功 ✨</div>
      <p style="font-size:1.1rem;margin:6px 0">${jobName(u.char.cls,sb,u.char.path)} → <b>${jobInfo(u).name}</b></p>`;
  }
  $('#fx').innerHTML = `<div class="overlay fx"><div class="fxbox orn">
    <span class="spark" style="left:6%;top:6%">✦</span><span class="spark" style="right:6%;top:8%;animation-delay:.4s">✧</span>
    <span class="spark" style="left:8%;top:38%;animation-delay:.8s">✧</span><span class="spark" style="right:8%;top:42%;animation-delay:.2s">✦</span>
    <div class="px fxbig">LEVEL UP!</div>${DIVIDER}
    ${avatar(u,96)}
    <div class="px" style="font-size:1.4rem;margin:8px 0">Lv.${lv.before} → Lv.${lv.after}</div>
    ${jobHtml}
    <p class="muted">艾拉：「越來越強了呢！繼續加油～」</p>
    ${btn}</div></div>`;
}

function initCaseForm(){
  const s=$('#f-stage'), r=$('#f-p'); if(!s) return;
  const sync=()=>{ const lo=+r.min, hi=+r.max; r.style.setProperty('--p', hi>lo ? (r.value-lo)/(hi-lo)*100 : 100); $('#f-plabel').textContent=r.value+'%'; };
  const setRange=()=>{ const st=+s.value, [lo,hi]=pRange(st); r.min=lo; r.max=hi;
    if(+r.value<lo || +r.value>hi) r.value=Math.min(Math.max(+r.value,lo),hi);   // 選階段不自動改進度，只確保在範圍內
    if(lo===hi){ r.min=0; r.max=100; r.value=100; }            // 完工：拉桿停在最右邊並鎖定
    r.disabled = lo===hi; $('#f-prange').textContent = lo===hi ? '完工固定為 100%（＝成交）' : '選階段不會自動改變進度，請自己拉動（階段順序不限）'; sync(); };
  s.onchange=()=>{
    document.querySelectorAll('[data-si]').forEach(b=>b.classList.toggle('on', +b.dataset.si===+s.value));
    const n=$('#f-stagenote'); n.style.display = +s.value===OTHER_STAGE ? '' : 'none';
    if(+s.value===OTHER_STAGE && !n.value) n.focus();
    if(+s.value!==DONE_STAGE && +r.value>=100) r.value=95;
    setRange(); if(+s.value===DONE_STAGE) pickSt('won',true); else if(ui.st==='won') pickSt('doing',true); };
  r.oninput=sync; setRange(false);
}
function setStage(i){ const s=$('#f-stage'); s.value=i; s.onchange(); }
function pickSt(k, fromStage){
  const s=$('#f-stage'), last=STAGES.length-1;
  if(s && !fromStage){                                   // 狀態和階段互相同步
    if(k==='won' && +s.value!==last){ s.value=last; s.onchange(); return; }
    if(k!=='won' && +s.value===last){ s.value=SIGN_STAGE; s.onchange(); }
  }
  ui.st=k;
  document.querySelectorAll('.stbtn').forEach(b=>{ const on=b.dataset.st===k; b.classList.toggle('on',on); b.textContent=(on?'✔ ':'')+STATUS[b.dataset.st].n; });
}
function saveCase(){
  const c=caseById(ui.caseId), u=me();
  let stage=+$('#f-stage').value, p=+$('#f-p').value, st=ui.st;
  const note=$('#f-note').value.trim(), last=STAGES.length-1;
  if(st==='won' || stage===last){ st='won'; stage=last; p=100; }
  const stageNote = stage===OTHER_STAGE ? $('#f-stagenote').value.trim() : '';
  if(stage===OTHER_STAGE && !stageNote){ $('#f-err').textContent='選了「其他」階段，請填寫目前在做什麼'; $('#f-stagenote').focus(); return; }
  if(!note && stage===c.stage && st===c.st && stageNote===(c.stageNote||'')){
    $('#f-err').textContent='請寫一句回報備註，或更新階段／狀態後再儲存'; $('#f-note').focus(); return; }
  const gains=[];
  c.stagesDone = c.stagesDone || [c.stage];
  if(!c.stagesDone.includes(stage)){ gains.push(['新階段', XP.stage]); c.stagesDone.push(stage); }
  const today=new Date().toDateString();
  if(note && c.noteDay!==today){ gains.push(['回報備註', XP.note]); c.noteDay=today; }
  let won=false;
  let blocked=false;
  if(c.dealXP && st!=='won'){
    const wu=userById(c.wonBy)||u;
    if(wu===u) gains.push(['取消成交', -XP.won]); else award(wu,[['取消成交', -XP.won]],c.id);
    c.dealXP=false; c.wonAt=null; c.wonBy=null; }
  if(st==='won' && !c.dealXP){
    c.wonAt=Date.now();
    if(c.revoked) blocked=true;                        // 會長撤銷過：再次成交不發經驗值
    else { gains.push(['成交', XP.won]); c.dealXP=true; c.wonBy=u.id; won=true; }
  }
  Object.assign(c,{stage,stageNote,p,st,updated:Date.now()});
  c.hist.unshift({t:Date.now(),by:u.id,stage,stageNote,p,st,note});
  const lv=award(u,gains,c.id);
  save(); go('home');
  const small=gains.filter(g=>g[0]!=='成交');
  if(blocked) toast('已更新為成交。此案件曾被會長撤銷成交，不再發放成交經驗值');
  else if(small.length) toast((small.some(g=>g[1]<0)?'':'✨ ')+small.map(g=>`${g[1]>0?'+':''}${g[1]} XP ${g[0]}`).join('　'));
  else if(!won) toast('已儲存更新');
  if(won){
    $('#fx').innerHTML = `<div class="overlay fx"><div class="fxbox orn">
      <span class="spark" style="left:6%;top:6%">🎉</span><span class="spark" style="right:6%;top:6%;animation-delay:.5s">✨</span>
      <div class="px fxbig gold">成交！</div>${DIVIDER}
      <div class="ava" style="border-color:#9db08a">${sprite('elara',110,'bust')}</div>
      <p style="font-size:1.15rem">恭喜拿下「<b>${esc(c.name)}</b>」！</p>
      <div class="px" style="font-size:1.6rem;color:var(--xp)">+${XP.won} XP</div>
      <button class="btn block" style="margin-top:14px" id="fx-ok">好耶！</button></div></div>`;
    $('#fx-ok').onclick=()=>{ $('#fx').innerHTML=''; levelFx(lv); };
  } else levelFx(lv);
}
function bossComment(){
  const c=caseById(ui.caseId), note=$('#b-note').value.trim();
  if(!note){ $('#b-err').textContent='請先寫下留言內容'; return; }
  c.hist.unshift({t:Date.now(),by:me().id,stage:c.stage,p:c.p,st:c.st,note,kind:'boss'}); c.bossUnread=true;
  save(); render(); toast('留言已送出，業務打開案件就會看到');
}
function transferCase(){
  const c=caseById(ui.caseId), to=$('#b-owner').value;
  if(to===c.owner){ toast('已經是這位業務負責'); return; }
  const a=userById(c.owner), b=userById(to);
  if(!confirm(`確定要把「${c.name}」從 ${a.name} 轉派給 ${b.name} 嗎？\n已經獲得的經驗值會留在 ${a.name} 身上。`)) return;
  c.owner=to; c.bossUnread=true;
  c.hist.unshift({t:Date.now(),by:me().id,stage:c.stage,p:c.p,st:c.st,note:`會長將案件從 ${a.name} 轉派給 ${b.name}`,kind:'boss'});
  save(); render(); toast(`已轉派給 ${b.name}`);
}
function revokeDeal(id){
  const c=caseById(id), o=userById(c.wonBy)||userById(c.owner);
  if(!confirm(`確定要撤銷「${c.name}」的成交嗎？\n${o.name} 會被扣回 ${XP.won} XP，案件改回「進行中」。\n之後這個案件再次成交，也不會重新發放成交經驗值。`)) return;
  c.dealXP=false; c.wonAt=null; c.wonBy=null; c.revoked=true; c.st='doing'; c.stage=SIGN_STAGE; c.p=Math.min(c.p,95);
  c.hist.unshift({t:Date.now(),by:me().id,stage:c.stage,p:c.p,st:'doing',note:'會長撤銷成交'});
  award(o,[['撤銷成交',-XP.won]],c.id);
  save(); ui.st='doing'; render(); toast('已撤銷成交，並扣回經驗值');
}

function exportExcel(){
  const d=t=>{ if(!t) return ''; const x=new Date(t), p=n=>String(n).padStart(2,'0'); return `${x.getFullYear()}/${p(x.getMonth()+1)}/${p(x.getDate())} ${p(x.getHours())}:${p(x.getMinutes())}`; };
  const name=id=>{ const u=userById(id); return !u ? '' : u.role==='boss' ? '會長' : u.name; };
  const sorted=S.cases.slice().sort((a,b)=>name(a.owner).localeCompare(name(b.owner),'zh-Hant')||b.updated-a.updated);
  const cases=sorted.map(c=>({ '客戶名稱':c.name, '負責業務':name(c.owner), '服務類別':catLabel(c), '目前階段':stageLabel(c), '整體進度(%)':c.p,
    '狀態':STATUS[c.st].n, '聯絡人':c.contact||'', '電話':c.phone||'', '地址':c.addr||'', '建立日期':d(c.created), '最後更新':d(c.updated),
    '未更新天數':daysSince(c.updated), '逾期提醒':isStale(c)?'是':'', '成交日期':d(c.wonAt) }));
  const hist=[]; sorted.forEach(c=>c.hist.forEach(x=>hist.push({ '客戶名稱':c.name, '時間':d(x.t), '更新者':name(x.by),
    '類型':x.kind==='boss'?'會長留言':'進度更新', '階段':x.kind==='boss'?'':stageLabel(x), '進度(%)':x.kind==='boss'?'':x.p,
    '狀態':x.kind==='boss'?'':STATUS[x.st].n, '備註／留言':x.note||'' })));
  const now=new Date(), m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const stats=S.users.filter(u=>u.role==='sales').map(u=>{ const m=S.cases.filter(c=>c.owner===u.id), k=s=>m.filter(c=>c.st===s).length;
    return { '業務':u.name, '等級':lvInfo(u.xp).lv, '稱號':u.char?jobInfo(u).name:'（尚未建立角色）', '案件數':m.length, '進行中':k('doing'), '已成交':k('won'),
      '暫無回應':k('quiet'), '無意願':k('no'), '逾期未更新':m.filter(isStale).length,
      '本月新增':m.filter(c=>c.created>=m0).length, '本月成交':m.filter(c=>c.wonAt&&c.wonAt>=m0).length }; });
  const day=d(Date.now()).slice(0,10).split('/').join('-'), file=`同欣案件報表_${day}`;
  if(window.XLSX){
    const wb=XLSX.utils.book_new();
    const add=(rows,title,widths)=>{ const ws=XLSX.utils.json_to_sheet(rows); ws['!cols']=widths.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,title); };
    add(cases,'案件總覽',[18,10,18,14,12,10,10,15,22,17,17,10,9,17]);
    add(hist,'更新紀錄',[18,17,10,10,14,9,10,40]);
    add(stats,'業務統計',[10,6,12,8,8,8,10,8,10,10,10]);
    XLSX.writeFile(wb, file+'.xlsx');
  } else {                                                   // 沒網路載不到套件時，改匯出 CSV（Excel 也能打開）
    const q=v=>'"'+String(v).split('"').join('""')+'"';
    const csv=[Object.keys(cases[0]||{}).map(q).join(',')].concat(cases.map(r=>Object.values(r).map(q).join(','))).join(String.fromCharCode(13,10));
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([String.fromCharCode(0xFEFF)+csv],{type:'text/csv'})); a.download=file+'.csv'; a.click();
  }
  toast('📥 報表已下載');
}

/* ===================== 公會名冊 ===================== */
function rosterView(){
  const boss=S.users.find(u=>u.role==='boss');
  const sales=S.users.filter(u=>u.role==='sales').sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  const row=u=>{ const L=lvInfo(u.xp);
    return `<div class="card member">${avatar(u,44)}<div style="flex:1;min-width:0">
      <div class="px ptitle">${u.role==='boss'?'👑 公會會長':titleOf(u)}</div>
      <div class="pname" style="font-size:1.15rem">${u.role==='boss'?'公會會長（老闆）':esc(u.name)}${u.role==='boss'?'':`<span class="px lv">Lv.${L.lv}</span>`}</div>
      ${u.role!=='boss'&&!u.char?'<div class="muted">尚未建立角色</div>':''}</div></div>`; };
  return `<div class="topbar"><h1 class="px">🏰 公會名冊</h1></div>
    <p class="hint">同欣冒險者公會的所有成員（依姓名排列）</p>
    ${row(boss)}${sales.map(row).join('')}${navBar()}`;
}

function replayTut(){
  const u=me();
  if(u.role==='boss'){ u.tutDone=false; go('lobby'); afterLogin(); return; }
  go('home');
  elara([
    '我是精靈嚮導<b>艾拉</b>，再帶你複習一次～',
    `案件顏色：<br>${badge('doing')} ${badge('won')}<br>${badge('quiet')} ${badge('no')}<br>進行中的案件超過 14 天沒更新，會出現 <span class="warn">⚠ 提醒</span>。`,
    '按「＋ 新增客戶」建立案件；點進案件可以選階段、微調進度、寫備註。每次更新要寫一句備註或推進階段，階段到「完工」就算成交。',

  ], null, {tut:true});
}
